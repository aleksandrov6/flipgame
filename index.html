<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перекуп Авито</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#141922;--mut:#6c778a;--ac:#2f7bff;--ac2:#6a5cff;--ok:#16a05a;--bad:#e5484d;--warn:#e89a1a;--bd:#e3e8f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#171d27;--tx:#eaf0f8;--mut:#8b97aa;--bd:#263040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#171d27;--tx:#eaf0f8;--mut:#8b97aa;--bd:#263040;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px;min-height:100vh}
.top{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:18px 16px 16px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(47,123,255,.25)}
.top small{opacity:.8;font-size:12px}
.top .bal{font-size:30px;font-weight:800;letter-spacing:-.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:rgba(255,255,255,.18);padding:5px 10px;border-radius:99px;font-size:13px;font-weight:600;margin-left:6px;white-space:nowrap}
.ev{margin:12px 12px 0;padding:10px 12px;border-radius:14px;background:rgba(232,154,26,.15);color:var(--warn);font-weight:600;font-size:13px}
.c{background:var(--card);border-radius:18px;padding:14px;margin:10px 12px;box-shadow:0 2px 10px rgba(20,30,50,.06);border:1px solid var(--bd)}
.c h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.price{font-weight:800;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ch{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--bg);color:var(--mut);font-weight:600}
.ch.ok{background:rgba(22,160,90,.14);color:var(--ok)}
.ch.bad{background:rgba(229,72,77,.14);color:var(--bad)}
.ch.on{background:var(--ac);color:#fff}
.b{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;background:var(--ac);color:#fff;cursor:pointer}
.b.g{background:var(--bg);color:var(--tx)}
.b.ok{background:var(--ok)}
.b.bad{background:var(--bad)}
.b:disabled{opacity:.45}
.b:active{transform:scale(.97)}
.acts{display:flex;gap:8px;margin-top:10px}.acts .b{flex:1}
.flt{display:flex;gap:6px;padding:12px 12px 0;overflow-x:auto}.flt .ch{padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:4px 0;position:relative;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:21px}
nav button.on{color:var(--ac)}
nav em{position:absolute;top:0;right:22%;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.df{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st div{background:var(--bg);border-radius:14px;padding:10px}.st b{display:block;font-size:17px}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.dk{margin:10px 12px;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#10285a,#4a1f8f 60%,#7b2d8e);color:#fff;min-height:62vh;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(40,30,120,.35)}
.dki{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:20px 12px;align-content:start}
.dki button{border:0;background:none;color:#fff;font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;position:relative;cursor:pointer}
.dki button:active{background:rgba(255,255,255,.15)}
.dki i{font-style:normal;font-size:34px;background:rgba(255,255,255,.14);width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.dki em{position:absolute;top:4px;right:calc(50% - 38px);background:var(--bad);font-style:normal;font-size:10px;border-radius:99px;padding:1px 6px}
.win{flex:1;margin:10px;border-radius:14px;overflow:hidden;background:var(--card);color:var(--tx);display:flex;flex-direction:column}
.win.dark{background:#0a0a10;color:#e8e8ee}
.win.dark .mut{color:#9aa0b4}.win.dark .ch:not(.ok):not(.bad){background:#1d1d2a;color:#aab}.win.dark .df{border-color:#23232f}
.wt{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(0,0,0,.16);font-weight:700;font-size:13px}
.wt button{border:0;background:var(--bad);color:#fff;border-radius:8px;width:28px;height:24px;font-weight:800;cursor:pointer}
.wb{padding:10px;overflow:auto;max-height:62vh}
.tbar{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:rgba(0,0,0,.35);font-size:12px;font-weight:600}
.term{background:#05080c;color:#4ade80;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;margin:8px 0;min-height:96px;white-space:pre-wrap}
.bmc{background:#14141c;border:1px solid #2a2a38;border-radius:14px;padding:12px;margin:8px 0}
.bmc .price{color:#ff6b6b}
.th{position:relative;flex:none;width:92px;height:114px;padding:6px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#eef1f7,#c5ccda);cursor:pointer}
.th svg{width:100%;height:100%;display:block}
.th span{position:absolute;right:4px;bottom:3px;font-size:11px;background:rgba(0,0,0,.5);color:#fff;border-radius:8px;padding:0 5px}
.vw{perspective:900px;height:320px;margin:8px 0;border-radius:18px;background:radial-gradient(circle at 50% 40%,#eef1f7,#bcc4d4);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.vi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.vi.dr{transition:none}
.vf{position:absolute;inset:0;padding:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none}
.vb{transform:rotateY(180deg)}
.vf svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.pul{animation:pul .9s ease-in-out infinite alternate}
@keyframes pul{to{opacity:.2}}
.vw.p3{touch-action:none;overflow:hidden}
.p3 .vi{width:150px;height:308px;margin:6px auto 0}
.p3 .vf{padding:0;transform:translateZ(9px)}
.p3 .vb{transform:rotateY(180deg) translateZ(9px)}
.wl{position:absolute;left:0;top:0;height:18px}
#rf{position:fixed;inset:0;z-index:40;background:#050806;color:#e9fff0;font:14px/1.4 ui-monospace,Menlo,monospace;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#rf h4{margin:14px 0 4px;font-size:18px}#rf p{margin:0 0 10px;color:#9fb3a6}#rf b{color:#e9fff0}
.rfh{display:flex;justify-content:space-between;align-items:center;color:#7dff9b;font-weight:700}
.rfh button{border:0;background:#1a211d;color:#e9fff0;border-radius:10px;width:34px;height:34px;font-size:16px}
.rfp{display:block;height:200px;margin:6px auto;background:#0a0f0c;border-radius:16px;width:100%}
.rfbar{height:10px;border-radius:9px;background:#14201a;margin:8px 0;overflow:hidden}.rfbar i{display:block;height:100%;width:0;background:#7dff9b}
.rfm{text-align:center;font-weight:800;color:#ffd24a;margin:6px 0 10px;min-height:20px}
.rfbt{display:flex;gap:10px;margin:6px 0}.rfbt button,.rfwf button{flex:1;border:1px solid #2a3a30;background:#0d1511;color:#e9fff0;border-radius:14px;padding:16px 8px;font:inherit;font-weight:800}
.rfbt button.on,.rfwf button.on{background:#7dff9b;color:#06140b;box-shadow:0 0 18px rgba(125,255,155,.4)}
.rfs{text-align:center;color:#6c8174;font-size:12px;margin-bottom:8px}
.rfid{text-align:center;font-size:30px;font-weight:800;color:#7dff9b;padding:16px 0}.rfid small{display:block;font-size:14px;color:#9fb3a6;font-weight:400}
.rfe{background:#b8392f;color:#fff;border-radius:14px;padding:10px 12px;font-weight:800;margin:8px 0;text-align:center}
.rfban{background:#10201a;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-bottom:6px}
.rff{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid #22302a;background:#0b110e;color:#e9fff0;border-radius:14px;padding:14px 10px;margin:6px 0;font:12px ui-monospace,Menlo,monospace}
.rff span{font-weight:800;white-space:nowrap}.rff .ok{color:#7dff9b}.rff .bad{color:#ff7b7b}.rff .wr{color:#ffb347}
.rfwf{background:#f4f5f8;color:#111;border-radius:18px;padding:12px;position:relative}.rfwf>b{display:block;color:#111;margin-bottom:8px;font-family:system-ui,sans-serif}
.rfwf button{display:block;width:100%;background:#fff;color:#111;border:0;border-bottom:1px solid #e3e5ea;border-radius:8px;padding:11px 8px;margin:0;text-align:left;font-weight:600}
.rfwf button.on{background:#7dff9b;box-shadow:none}
.rfst{position:static;background:#ffdc5e;color:#000;padding:10px 12px;border-radius:6px;margin:0 0 10px;font:700 14px/1.5 system-ui,sans-serif;box-shadow:0 4px 10px rgba(0,0,0,.25)}#rf .rfst,#rf .rfst *{color:#000}.rfst b{font-size:17px;font-weight:900;letter-spacing:.3px}#rf .rfwf>b{color:#000}.rfst small{display:block;font-weight:600;font-size:12px;opacity:.8}
#rfin{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:1px solid #2a3a30;background:#0d1511;color:#e9fff0;font:inherit}
.rfl{background:#05080c;border:1px solid #1a251e;border-radius:12px;padding:10px;margin:12px 0 0;color:#4ade80;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;min-height:70px}

/* --- иконки, профиль, ремонт --- */
.toast{z-index:60}
.top{position:relative}
.pb{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.pb.on{background:#fff;color:var(--ac)}
.pb svg,nav button i svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.pb svg{width:22px;height:22px;stroke-width:2}
nav button i{display:grid;place-items:center;width:50px;height:30px;margin:0 auto 2px;border-radius:15px;transition:.2s}
nav button i svg{width:23px;height:23px;stroke-width:1.9}
nav button.on i{background:rgba(47,123,255,.15)}
.dki i.ic{width:62px;height:62px;border-radius:19px;background:var(--g);box-shadow:0 8px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.dki i.ic svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.bm{--g:linear-gradient(145deg,#5a5f78,#15161e)}.ic.ul{--g:linear-gradient(145deg,#34d399,#059669)}.ic.up{--g:linear-gradient(145deg,#60a5fa,#2563eb)}.ic.bd{--g:linear-gradient(145deg,#fbbf24,#ea580c)}.ic.pg{--g:linear-gradient(145deg,#f472b6,#9333ea)}
#rp{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 70% at 50% 0,#1c2a47 0,#0b0f16 62%);color:#e8edf7;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));font:14px/1.4 system-ui,sans-serif}
.rph{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.rph button{width:36px;height:36px;border:0;border-radius:12px;background:#222a3a;color:#fff;font-size:16px}
.rpb{display:block;width:100%;margin:8px 0;border:0;border-radius:12px;background:#2f7bff;color:#fff;font:inherit;font-weight:700;padding:12px}.rpb.ok{background:#16a05a}.rpb.g{background:#222a3a}
.rpm{text-align:center;color:#9aa6bd;margin:4px 0 8px}
.rpsteps{display:flex;gap:6px;margin:10px 0 2px;font-size:11px;font-weight:700}.rpsteps span{flex:1;text-align:center;padding:6px 2px;border-radius:99px;background:#161d2b;color:#6f7b93}.rpsteps .on{background:#2f7bff;color:#fff}.rpsteps .dn{background:rgba(22,160,90,.2);color:#7dff9b}
.rpmain{display:flex;gap:14px;align-items:flex-start;margin:14px 0 8px}.rpmain.c{justify-content:center}
.rpstage{position:relative;flex:0 0 min(48vw,196px);width:min(48vw,196px);isolation:isolate;perspective:900px}
.rpmain.c .rpstage{flex-basis:min(60vw,230px);width:min(60vw,230px)}
.rpstage::before{content:"";position:absolute;inset:-12px;border-radius:26px;z-index:-1;background:linear-gradient(#10182a,#0b111b);border:1px solid #1f2a40;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.rpstage svg{display:block;width:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.rpint.u{position:absolute;inset:0}.rpint.in{animation:rpin .6s}
.rplid{position:relative;z-index:2;transform-origin:50% 100%}
.rplid.glow{animation:rpglow 1.8s ease-in-out infinite alternate}
.rplid.lift{animation:rplift .75s cubic-bezier(.4,.1,.2,1) forwards;pointer-events:none}
.rplid.land{animation:rpland .65s cubic-bezier(.3,.1,.2,1) both}
@keyframes rpglow{to{filter:drop-shadow(0 0 12px rgba(80,160,255,.7))}}
@keyframes rplift{35%{transform:translateY(-4%) rotateX(22deg) scale(1.05)}100%{transform:translateY(-62%) rotateX(40deg) rotate(-12deg) scale(.88);opacity:0}}
@keyframes rpland{from{transform:translateY(-62%) rotateX(40deg) rotate(-12deg) scale(.88);opacity:0}65%{opacity:1;transform:translateY(-3%) rotateX(14deg) scale(1.03)}to{transform:none}}
@keyframes rpin{from{opacity:.3;transform:scale(.96)}}
.rpside{flex:1;min-width:0}
.rpcov{display:flex;gap:8px;align-items:center;padding:8px;border-radius:14px;border:1px solid #2c374d;background:#131a27;font-size:12px}.rpcov.bad{border-color:#ff4d4d}.rpcov.good{border-color:#7dff9b}.rpcov.tgt{outline:2px dashed #ffd24a}.rpcov.hov{background:#2a2410}
.rpcf{flex:none;width:40px}.rpcf svg{width:100%;display:block}
.rpcov small,.rpt small{display:block;color:#9aa6bd;font-size:11px;font-weight:400}
.rpth{margin:12px 2px 6px;font-weight:800}.rpth small{display:block;color:#9aa6bd;font-weight:500;font-size:11px}
.rptray{display:flex;flex-direction:column;gap:6px}.rpe{color:#7dff9b;padding:10px;text-align:center}
.rpt{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;background:linear-gradient(#222c42,#18202f);border:1px solid #3a4766;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:12px}
.rpt i{font-style:normal;font-size:20px}.rpt span{flex:1;min-width:0}.rpt em{font-style:normal;font-weight:800;color:#ffd24a;white-space:nowrap}
.rpt.lift{opacity:.3}.rpg{position:fixed;z-index:80;width:190px;pointer-events:none;transform:translate(-50%,-60%) scale(1.06) rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.rpp{cursor:pointer;transform-box:fill-box;transform-origin:center}
.rpp .lb{fill:#e3e8f4;font:700 8.5px system-ui,sans-serif;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:2px;pointer-events:none}
.rpp .bdov,.rpp .gd,.rpp .tg{display:none}.rpp.bad .bdov{display:block;animation:pul .8s ease-in-out infinite alternate}.rpp.good .gd{display:block}
.rpp .tg{fill:none;stroke:#ffd24a;stroke-width:2.5;stroke-dasharray:6 4}.rpp.tgt .tg{display:block;animation:rpdash .6s linear infinite}
.rpp.hov{filter:drop-shadow(0 0 7px #ffd24a)}.rpp.sel>rect:first-child{stroke:#ffd24a;stroke-width:2.5}
@keyframes rpdash{to{stroke-dashoffset:-20}}
.rpp.swap{animation:rpswap .75s}.rpp.shake{animation:rpsh .45s}
@keyframes rpswap{0%{transform:none;opacity:1}35%{transform:translateY(-44px);opacity:0}65%{transform:translateY(44px);opacity:0}100%{transform:none;opacity:1}}
@keyframes rpsh{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.rpn{background:#131a27;border:1px solid #24304a;border-radius:14px;padding:12px;margin:8px 0}

/* --- 3D-ремонт: ноутбук / ПК / приставка --- */
.rd3{height:min(330px,82vw);perspective:900px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;margin:8px 0;border-radius:18px;background:radial-gradient(circle at 50% 45%,#1c2a47,#0b0f16 75%);border:1px solid #1f2a40;user-select:none;-webkit-user-select:none}
.rd3.o{touch-action:pan-y;cursor:default}
.rdm{position:relative;transform-style:preserve-3d}
.rdm>div{position:absolute}
.rdw{pointer-events:none;background-image:linear-gradient(90deg,rgba(255,255,255,.18),rgba(0,0,0,.28))}
.rdbed{left:0;top:0;width:100%;height:100%;background:linear-gradient(135deg,#0c2a24,#0a1a2a);border-radius:12px;border:2px solid #1f2a40;box-shadow:inset 0 0 24px #000}
.rdcv{left:0;top:0;width:100%;height:100%;border-radius:14px;overflow:hidden;transform:translateZ(var(--z));box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.rdsv{position:absolute;width:320px;height:240px;pointer-events:none}.rdsv svg{width:100%;height:100%;display:block}
.k-lift .rdcv{--o:translateZ(var(--z)) translate3d(0,-85%,70px) rotateX(35deg);--oo:0}
.k-hood .rdcv{transform-origin:50% 0;--o:translateZ(var(--z)) rotateX(82deg);--oo:.92}
.k-door .rdcv{transform-origin:0 50%;--o:translateZ(var(--z)) rotateY(-112deg);--oo:1}
.rdcv.pop{animation:rdo .8s cubic-bezier(.4,.1,.2,1) forwards;pointer-events:none}
.rdcv.off{transform:var(--o);opacity:var(--oo);pointer-events:none}
.rdcv.land{animation:rdl .7s cubic-bezier(.3,.1,.2,1) both}
@keyframes rdo{to{transform:var(--o);opacity:var(--oo)}}
@keyframes rdl{from{transform:var(--o);opacity:var(--oo)}}
.rds{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eef1f8,#7d869a 60%,#4a5266);box-shadow:0 2px 4px rgba(0,0,0,.6);cursor:pointer;outline:2px solid rgba(255,210,74,.75);outline-offset:3px}
.rds::before,.rds::after{content:"";position:absolute;left:5px;right:5px;top:12px;height:2px;background:#2a3040;border-radius:1px}.rds::after{transform:rotate(90deg)}
.rds.out{animation:rdso .45s forwards;pointer-events:none}
@keyframes rdso{to{transform:rotate(540deg) scale(1.8);opacity:0}}
.rds.hole,.rds:disabled{background:radial-gradient(#05070b 45%,#2a3040);box-shadow:inset 0 1px 3px #000;cursor:default;outline:0}
.rds.hole::before,.rds.hole::after,.rds:disabled::before,.rds:disabled::after{display:none}
.rdp{position:absolute;border-radius:8px;border:1.5px solid #2f3a52;background:linear-gradient(#1b2438,#121a29);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfd8ea;cursor:pointer;overflow:hidden;text-align:center}
.rdp i{font-style:normal;font-size:20px;line-height:1}.rdp b{font:700 8.5px/1.1 system-ui,sans-serif;margin-top:2px}

      if(c.id){if(S.done.includes(c.id))return;S.done.push(c.id);if(S.done.length>200)S.done.shift()}

  else if(R.done)b=`<div class="rfid">🤖<small>${nm(R.d)}: ${v[1]} установлена</small></div><div class="rfm">Цена выросла на ${Math.round(v[2]*100)}%. Приставка готова к продаже.</div><div class="rfbt"><button class="on" data-r="x">Готово</button></div>`;
  else b='';
  el.innerHTML=`<div class="rfh"><span>Root Алисы · ${esc(nm(R.d))}</span><button data-r="x">✕</button></div><h4>Шаг ${R.st} из 3 · ${T}</h4><p>${H}</p>${b}<pre class="rfl" id="rfl">${esc(R.log.slice(-7).join('\n'))}</pre>`}
function raFail(R,msg){if(R.fail)return;const v=PGV[R.sel],d=R.d;R.fail=msg;R.log.push('✗ '+msg);S.skx=(S.skx||0)+1;
  if(Math.random()<v[8]){R.brick=1;d.broke=1;d.offer=0;S.pgr='💥 '+nm(d)+': приставка превратилась в кирпич';toast('💥 Сбой прошивки: '+nm(d)+' превратилась в кирпич')}
  else S.pgr='❌ '+nm(d)+': сбой, приставка цела, деньги потрачены';
  save();raR()}
function raDone(R){if(R.done)return;const d=R.d,v=PGV[R.sel],lv0=skLv();
  if(!S.inv.includes(d)){raX();return}
  d.pg=v[2];d.pgn=v[1];d.pv=R.sel;d.offer=0;d.pu=0;S.skx=(S.skx||0)+v[7];
  S.pgr='✅ '+nm(d)+': '+v[1]+' установлена, цена +'+Math.round(v[2]*100)+'%';R.done=1;
  toast('🤖 '+v[1]+' на '+nm(d)+': цена +'+Math.round(v[2]*100)+'% · '+gain(RI(8,14)+v[7]));
  if(skLv()>lv0)toast('🧠 Навык программирования: ур. '+skLv());
  save();raR()}
function raC(e){const t=e.target.closest('[data-r]');if(!t||!RA)return;const R=RA,r=t.dataset.r,i=+t.dataset.i,v=PGV[R.sel];
  if(r==='x')raX();
  else if(r==='p'||r==='v'){if(R.st===1&&!R.ok){R[r]=R[r]?0:1;raR()}}
  else if(r==='fw'){const fw=R.F[i];
    if(fw.k==='wrong'){R.msg='Образ от '+fw.n.split('_')[0]+'… не для этой модели 😬';R.log.push('✗ Образ от другой модели — запись прервана')}
    else if(fw.k==='old'){R.msg='Эта версия не подписана — загрузчик откажет (ошибка 0x3194)';R.log.push('✗ Образ не подписан')}
    else{if(lose(v[3]))return;save();R.fw=fw;R.st=3;R.msg='';R.log=['Образ: '+fw.n]}
    raR()}
  else if(r==='cab'){R.cab=1;R.log.push('✔ Кабель переподключён');raR()}
  else if(r==='net'){R.net=RANET[i];raR()}
  else if(r==='again'){raReset();raR()}
  else if(r==='act'){const n=R.net==='Alisa_Setup_5G',p=(R.in||'').replace(/\D/g,'')===R.code4;
    if(!n||!p){R.msg=!n?'Не та сеть — выбери Alisa_Setup_5G 😬':'Неверный код — смотри на экран ТВ';R.log.push('✗ Привязка не удалась');raR();return}
    raDone(R)}}
function raT(){const R=RA;if(!R)return;const n=Date.now(),B=x=>{const b=$('#rfb');if(b)b.style.width=x*100+'%'},rs=m=>{R.ph='idle';R.p=R.v=0;R.msg=m;raR()},v=PGV[R.sel],mm=()=>{const m=$('#rfm');if(m)m.textContent=raMsg(R)};
  if(R.st===1&&!R.ok){
    if(R.ph==='idle'){if(R.p&&R.v){R.ph='both';R.t=n;R.msg='';mm()}}
    else if(R.ph==='both'){if(!(R.p&&R.v))rs('Рано отпустил — начни заново');else{const e=(n-R.t)/R.t1;B(Math.min(1,e));if(e>=1){R.ph='rel';R.t=n;B(1);mm()}}}
    else if(R.ph==='rel'){if(!R.v)rs('RESET отпущен — заново');else if(!R.p){R.ph='hold';R.t=n;B(0);mm()}else if(n-R.t>5000)rs('Слишком долго держал ПИТАНИЕ — заново')}
    else if(R.ph==='hold'){if(!R.v)rs('RESET отпущен — заново');else{const e=(n-R.t)/R.t2;B(Math.min(1,e));if(e>=1){R.ok=1;R.log.push('✔ Устройство в режиме загрузчика');raR();setTimeout(()=>{if(RA===R){R.st=2;R.msg='';raR()}},900)}}}
  }else if(R.st===3&&!R.fail&&!R.done){
    if(R.cab){R.fp=Math.min(1,R.fp+.1/pgT(v));B(R.fp);const k=Math.floor(R.fp*RALOG.length);let ch=0;while(R.n<k){R.log.push(RALOG[R.n++]);ch=1}if(ch){const l=$('#rfl');if(l)l.textContent=R.log.slice(-7).join('\n')}
      if(R.fp>=.45&&!R.ev){R.ev=1;R.cab=0;R.et=n;R.log.push('✗ USB-кабель отключён!');raR();return}
      if(R.fw.k==='beta'&&R.fp>=.85&&!R.bc){R.bc=1;if(Math.random()<.5){raFail(R,'Бета-сборка не прошла проверку (ошибка 0x4005)');return}}
      if(R.fp>=.9&&!R.vb){R.vb=1;if(R.fw.k!=='beta'&&Math.random()<raFl(v)){raFail(R,'Проверка vbmeta не пройдена (ошибка 0x1F)');return}}
      if(R.fp>=1&&!R.fail){R.log.push('✔ Запись завершена');raDone(R)}
    }else if(n-R.et>3000+400*S.pc+200*skLv())raFail(R,'Кабель не переподключён вовремя (ошибка 0xE4)')}}

if(!S){S=fresh();regen()}
if(!S.mk.some(x=>I[x.dev.key]&&I[x.dev.key][1]>=1e6))elite(1);
render();
</script>
