function raReset(){const R=RA;Object.assign(R,{st:1,p:0,v:0,ph:'idle',t:0,msg:'',fp:0,n:0,cab:1,ev:0,bc:0,vb:0,fail:'',brick:0,net:'',in:'',ok:0,done:0,fw:null,t1:3000+500*R.sel,t2:2000+500*R.sel,code4:String(100000+Math.floor(Math.random()*899999)),log:['$ adb devices','Подключено: '+R.code+', Alice '+R.ver]})}
function raX(){if(!RA)return;clearInterval(RA.iv);const e=$('#rf');if(e)e.remove();RA=null;render()}
const raMsg=R=>R.ok?'✔ Режим загрузчика включён':R.msg||({idle:'Нажми обе кнопки',both:'Держи обе кнопки…',rel:'Отпусти ПИТАНИЕ! RESET – держи',hold:'Держи RESET…'})[R.ph];
function raPh(R){const s3=R.st===3,g='#7dff9b',c=x=>x?g:'#8890a8',cut=s3&&!R.cab;
  return`<svg viewBox="0 0 200 150" class="rfp"><rect x="26" y="34" width="148" height="70" rx="12" fill="#0d1224" stroke="#8890a8" stroke-width="4"/><rect x="36" y="44" width="86" height="50" rx="6" fill="${s3?'#000':'#1b2547'}"/>`+
  (s3?`<rect x="46" y="68" width="66" height="4" rx="2" fill="#333"/><rect x="46" y="68" width="${66*R.fp}" height="4" rx="2" fill="#eee"/>`:`<text x="79" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="${R.ok?g:'#8890a8'}">${R.ok?'FASTBOOT':'ALISA'}</text>`)+
  `<circle cx="146" cy="54" r="6" fill="${c(R.ok||(s3&&R.cab)||(R.p&&!s3))}"/><circle cx="146" cy="76" r="4" fill="${c(R.v&&!s3)}"/><text x="146" y="94" text-anchor="middle" font-size="8" fill="#8890a8">RESET</text><path d="M100 104V134H60" stroke="${cut?'#ff5a5a':'#8890a8'}" stroke-width="3" fill="none" ${cut?'stroke-dasharray="4 9"':''}/></svg>`}
function raR(){const R=RA,el=$('#rf');if(!R||!el)return;const v=PGV[R.sel];
  const T=['','режим загрузчика','выбор образа','запись','привязка Алисы'][R.st],

  el.innerHTML=`<div class="rfh"><span>Root Алисы · ${esc(nm(R.d))}</span><button data-r="x">✕</button></div><h4>Шаг ${R.st} из 4 · ${T}</h4><p>${H}</p>${b}<pre class="rfl" id="rfl">${esc(R.log.slice(-7).join('\n'))}</pre>`}
function raFail(R,msg){if(R.fail)return;const v=PGV[R.sel],d=R.d;R.fail=msg;R.log.push('✗ '+msg);S.skx=(S.skx||0)+1;

function raC(e){const t=e.target.closest('[data-r]');if(!t||!RA)return;const R=RA,r=t.dataset.r,i=+t.dataset.i,v=PGV[R.sel];
  if(r==='x')raX();

function raT(){const R=RA;if(!R)return;const n=Date.now(),B=x=>{const b=$('#rfb');if(b)b.style.width=x*100+'%'},rs=m=>{R.ph='idle';R.p=R.v=0;R.msg=m;raR()},v=PGV[R.sel],mm=()=>{const m=$('#rfm');if(m)m.textContent=raMsg(R)};

    }else if(n-R.et>3000+400*S.pc+200*skLv())raFail(R,'Кабель не переподключён вовремя (ошибка 0xE4)')}}
